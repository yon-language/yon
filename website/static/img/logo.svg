<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Yon — zen monk cat inside an enso (well-fed edition) -->
  <!-- night-sky disc: the pale cat must stand out on ANY background -->
  <circle cx="128" cy="128" r="106" fill="#262050"/>
  <!-- enso: fully closed, uniform ring -->
  <circle cx="128" cy="128" r="106"
        fill="none" stroke="#5b4bb5" stroke-width="14"/>

  <!-- robe (kasaya): rounder, well-fed seated silhouette -->
  <path d="M 128 96
           C 90 110 60 146 56 196
           L 200 196
           C 196 146 166 110 128 96 Z"
        fill="#8071d6"/>
  <!-- robe fold -->
  <path d="M 128 100 C 112 128 98 160 92 196 L 128 196 Z"
        fill="#6a59c4"/>
  <!-- sash, wider around the new girth -->
  <path d="M 88 148 C 114 140 142 140 168 148 L 164 164 C 142 156 114 156 92 164 Z"
        fill="#f5b942"/>

  <!-- belly -->
  <ellipse cx="128" cy="178" rx="32" ry="19" fill="#efe9ff"/>
  <ellipse cx="128" cy="178" rx="32" ry="19" fill="none" stroke="#d9cdf5" stroke-width="2"/>

  <!-- paws in zazen mudra, resting on the belly -->
  <ellipse cx="128" cy="180" rx="22" ry="10" fill="#efe9ff"/>
  <circle cx="128" cy="173" r="6" fill="#efe9ff"/>

  <!-- head -->
  <circle cx="128" cy="74" r="34" fill="#efe9ff"/>
  <!-- ears -->
  <path d="M 100 56 L 92 28 L 116 44 Z" fill="#efe9ff"/>
  <path d="M 156 56 L 164 28 L 140 44 Z" fill="#efe9ff"/>
  <path d="M 102 52 L 98 36 L 112 46 Z" fill="#caa9e8"/>
  <path d="M 154 52 L 158 36 L 144 46 Z" fill="#caa9e8"/>

  <!-- closed meditative eyes -->
  <path d="M 110 74 Q 116 80 122 74" fill="none" stroke="#3a2f72" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 134 74 Q 140 80 146 74" fill="none" stroke="#3a2f72" stroke-width="3.4" stroke-linecap="round"/>
  <!-- nose + mouth -->
  <path d="M 125 84 L 131 84 L 128 89 Z" fill="#caa9e8"/>
  <path d="M 128 89 Q 128 93 123 94 M 128 89 Q 128 93 133 94"
        fill="none" stroke="#3a2f72" stroke-width="2.2" stroke-linecap="round"/>
  <!-- whiskers: six, three a side -->
  <path d="M 96 80 L 77 75 M 96 85 L 75 85 M 96 90 L 78 94"
        stroke="#b9a7e6" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 160 80 L 179 75 M 160 85 L 181 85 M 160 90 L 178 94"
        stroke="#b9a7e6" stroke-width="2.6" stroke-linecap="round"/>
</svg>
